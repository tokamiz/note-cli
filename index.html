<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bash Note - Einfache Notizen im Terminal</title>
        <script src="https://tailwindcss.com"></script>
    </head>
    <body>
        <div class="max-w-5xl mx-auto px-4 pt-16 pb-12 text-center bg-cyan-500 rounded-lg" text-white>
            <h1>Bash-Tool. Ein Projekt für Notizin</h1>
            <ul>
                <li>note add <text> – Speichert die Notiz unter .notes/db/<hash></hash></li>
                <li>ote list – Listet alle gespeicherten Notizen mit ihrem Hash auf</li>
                <li>note delete <hash> – Löscht die Notiz mit dem entsprechenden Hash</li>
            </ul>
        </div>
    </body>

    </footer>
</html>
