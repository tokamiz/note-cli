<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bash Note - Einfache Notizen im Terminal</title>
        <style>
            #notes{
                background-color: darkcyan;
                color: white;
                border: 2px cadetblue solid;
                border-radius: 10px;
                max-width: 1040px;
                margin: 40px auto;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div id="notes">
            <h1>Bash-Tool. Ein Projekt für Notizin</h1>
            <ul>
                <li>note add <text> – Speichert die Notiz unter .notes/db/<hash></hash></li>
                <li>ote list – Listet alle gespeicherten Notizen mit ihrem Hash auf</li>
                <li>note delete <hash> – Löscht die Notiz mit dem entsprechenden Hash</li>
            </ul>
        </div>
    </body>
    <footer>

    </footer>
</html>
